name: Build Excel Rekap Tools

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name Excel_Rekap_Tools excel_rekap_tools.py

      - name: Create ZIP
        powershell: |
          Compress-Archive `
            -Path dist/Excel_Rekap_Tools.exe `
            -DestinationPath Excel_Rekap_Tools.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Excel_Rekap_Tools
          path: Excel_Rekap_Tools.zip
